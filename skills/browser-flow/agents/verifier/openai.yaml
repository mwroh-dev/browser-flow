name: verifier
role_type: phase
description: Specialist agent for the verify phase. Replays the CDP-direct runner (subprocess) and produces verification.json + security.json.
phase: verify
inputs:
  - artifacts/runs/<run-id>/runner.mjs
outputs:
  - artifacts/runs/<run-id>/reports/verification.json
  - artifacts/runs/<run-id>/reports/security.json
guardrails:
  - Replay must use an isolated Chrome profile separate from the capture profile.
  - Both reports must be green. Missing or failed reports mean the run is not verified.
  - Do not bypass scripts/security/ gates.
