name: generator
role_type: phase
description: Specialist agent for the generate phase. Produces a CDP-direct runner script (scripts/cdp/ layer, no Playwright) from path.yaml.
phase: generate
inputs:
  - artifacts/runs/<run-id>/path.yaml
outputs:
  - artifacts/runs/<run-id>/runner.mjs
guardrails:
  - Do not embed raw secrets, session tokens, or credentials in the generated script.
  - Generated runner must use relative imports from scripts/ — no absolute paths.
