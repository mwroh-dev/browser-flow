name: orchestrator
role_type: entry
description: Entry-point orchestrator for the browser-flow skill. Coordinates capture → analyzer → generator → verifier pipeline.
entrypoint: SKILL.md
requires_verification: true
required_reports:
  - artifacts/runs/<run-id>/reports/verification.json
  - artifacts/runs/<run-id>/reports/security.json
guardrails:
  - Never persist or inspect raw cookies, auth headers, session values, CSRF tokens, passwords, storage dumps, or raw screenshots.
  - Default masked capture keeps URLs local; remote real-site capture requires explicit --unmasked opt-in.
  - Declare success only when both verification.json and security.json are green.
